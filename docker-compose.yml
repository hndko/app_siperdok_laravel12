x-siperdok-app: &siperdok-app
  build:
    context: .
    dockerfile: Dockerfile
  image: siperdok-app
  pull_policy: never

services:
  app:
    <<: *siperdok-app
    container_name: siperdok_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-db_siperdok_laravel12}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    volumes:
      - .:/var/www
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - siperdok-network

  migrate:
    <<: *siperdok-app
    container_name: siperdok_migrate
    restart: "no"
    working_dir: /var/www
    command: php artisan migrate --force
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-db_siperdok_laravel12}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - siperdok-network

  webserver:
    image: nginx:alpine
    container_name: siperdok_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - siperdok-network

  queue:
    <<: *siperdok-app
    container_name: siperdok_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work database --tries=3 --timeout=60 --sleep=3
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-db_siperdok_laravel12}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    volumes:
      - .:/var/www
    depends_on:
      app:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - siperdok-network

  scheduler:
    <<: *siperdok-app
    container_name: siperdok_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-db_siperdok_laravel12}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    volumes:
      - .:/var/www
    depends_on:
      app:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - siperdok-network

  postgres:
    image: postgres:17-alpine
    container_name: siperdok_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-db_siperdok_laravel12}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-db_siperdok_laravel12}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - siperdok-network

  redis:
    image: redis:alpine
    container_name: siperdok_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - siperdok-network

networks:
  siperdok-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
